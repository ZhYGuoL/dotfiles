# ~/.tmux.conf
# Starter tmux config for a Ghostty + Neovim workflow.
# Reload after editing with: prefix + r  (prefix is Ctrl-a below).

# ---------- Colors / terminal ----------
# Advertise a 256-color, truecolor-capable terminal to programs inside tmux.
set -g default-terminal "tmux-256color"
# Tell tmux that Ghostty (outside) supports RGB truecolor.
set -ag terminal-overrides ",xterm-ghostty:RGB"
set -ag terminal-overrides ",xterm-256color:RGB"
# Undercurl + colored underlines (nice for Neovim diagnostics/spelling).
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p2%{256}%/%d::%p3%d%;m'

# ---------- Core behavior ----------
# Critical for Neovim: near-zero delay when pressing Esc.
set -sg escape-time 10
# Let Neovim know when the terminal gains/loses focus (autoread, etc.).
set -g focus-events on
set -g mouse on
set -g history-limit 100000
set -g base-index 1          # windows start at 1
setw -g pane-base-index 1    # panes start at 1
set -g renumber-windows on   # keep window numbers gap-free
set -g set-clipboard on      # integrate with system clipboard via OSC52
set -g allow-passthrough on  # let image protocols (Kitty/iTerm2) pass through to Ghostty

# ---------- Prefix: Ctrl-b -> Ctrl-a (ergonomic, Kun-style) ----------
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# ---------- Splits that keep the current directory ----------
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# ---------- Reload config ----------
unbind r
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# ---------- Pane resize (prefix then h/j/k/l, repeatable) ----------
bind -r h resize-pane -L 5
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r m resize-pane -Z   # toggle maximize/zoom current pane

# ---------- Seamless Neovim <-> tmux pane navigation (Ctrl-h/j/k/l) ----------
# Works out of the box for plain shells; install the Neovim side
# (christoomey/vim-tmux-navigator) to make it jump into nvim splits too.
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
  | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'

# ---------- Copy mode: vi keys ----------
setw -g mode-keys vi
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi y send -X copy-selection-and-cancel
# Copy to system clipboard when mouse drag ends, then stay in copy mode
bind-key -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe 'pbcopy'

# ---------- Active pane indication (Rose Pine, transparency-safe) ----------
# 1) Thicker + colored border around the focused pane.
set -g pane-border-lines heavy
set -g pane-border-style "fg=#44415a"                 # inactive: dim
set -g pane-active-border-style "fg=#9ccfd8,bold"     # active: foam, bold
# 2) Dim the TEXT of unfocused panes so the active one pops.
#    bg=default keeps Ghostty's transparency intact (no solid fill).
#    If you'd rather keep all panes equally bright, delete these two lines.
set -g window-style "fg=#6e6a86,bg=default"           # inactive panes: muted text
set -g window-active-style "fg=#e0def4,bg=default"    # active pane: normal bright text
# 3) Show the folder + running command on each pane's border, active one highlighted.
set -g pane-border-status top
set -g pane-border-format " #{?pane_active,#[fg=#9ccfd8]●#[default],○} #{pane_current_command}  #{b:pane_current_path} "

# ---------- Status bar (minimal, dark) ----------
set -g status-position top
set -g status-style "bg=default fg=white"
set -g status-left "#{?client_prefix,#[fg=#232136,bg=#9ccfd8,bold]  ^A  #[default],#[fg=cyan,bold] #S #[default]} "
set -g status-left-length 30
set -g status-right "#[fg=grey]%a %d %b  #[fg=cyan]%H:%M "
setw -g window-status-current-format "#[fg=cyan,bold] #I:#W "
setw -g window-status-format " #I:#W "
